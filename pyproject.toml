[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "grain-dry"
version = "0.1.0"
description = "Zero-dependency post-harvest grain drying & food safety toolkit: ASABE D245.6 Modified Henderson sorption isotherms, water-activity aflatoxin gates, solar/biomass dryer energy balance, and safe storage limits."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Akandwanaho Ivan Alvin" }]
keywords = [
    "post-harvest",
    "grain-drying",
    "aflatoxin",
    "water-activity",
    "agritech",
    "food-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
grain-dry = "grain_dry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grain_dry"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
